name: Build ShakeBlocker DEBs

# ============================================================
# 用 GitHub Actions 免费 ubuntu runner 自动编译两个 DEB：
#   - rootful  (iOS 13-14, iphoneos-arm,   mobilesubstrate)
#   - rootless (iOS 15-16, iphoneos-arm64, ellekit)
# 两个包共用 Package Identifier，APT 按设备架构自动选包。
#
# 为什么用 Linux 而不是 macOS：
#   macos-14(Apple Silicon) 是 10x 计费，免费账号无 macOS 分钟会 1 秒秒取消；
#   macos-13 会长时间排队拿不到 runner。theos-action 让 ubuntu 也能编 Theos tweak，
#   免费、额度充足、无需排队，是社区标准做法。
#
# 触发：push 到 main/master、打 v* 标签、PR、手动 workflow_dispatch
# 产物：Actions 页面 Artifacts 下载；打标签时自动发 Release
# ============================================================

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 仅“打标签发 Release”需要；不需要可改成 read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build rootful + rootless
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 一键装 Theos + 免费 Linux toolchain + iOS SDK + ldid（社区维护的 action）
      - name: Install Theos (Linux toolchain + SDK)
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          "$THEOS/bin/ldid" -v 2>&1 | head -3 || true
          ls -d "$THEOS/sdks"/*.sdk 2>/dev/null || true

      - name: Build rootful (iOS 13-14, iphoneos-arm)
        run: |
          make clean
          make package

      - name: Build rootless (iOS 15-16, iphoneos-arm64)
        run: |
          make clean            # 必须：清掉上一 scheme 的 staging
          make SCHEME=rootless package

      - name: Collect DEBs
        run: |
          mkdir -p artifacts
          find "$GITHUB_WORKSPACE/packages" -name '*.deb' -type f -exec cp -v {} artifacts/ \;
          echo "---- artifacts ----"
          ls -lh artifacts
          test -n "$(ls artifacts/*.deb 2>/dev/null)" || { echo "No DEB produced!"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShakeBlocker-DEBs
          path: artifacts/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
          generate_release_notes: true
